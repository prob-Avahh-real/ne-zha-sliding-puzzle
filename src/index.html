<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>哪吒华容道</title>
</head>
<body>
  <div id="app">
    <header>
      <h1>哪吒华容道</h1>
      <p class="subtitle">使用《哪吒》电影角色，完成拼图并挑战时间与步数。</p>
    </header>

    <section id="game-area">
      <div class="controls">
        <button id="shuffle-button">重新乱序</button>
        <button id="restart-button">重新开始</button>
      </div>
      <div class="game-info">
        <div>剩余时间: <span id="time-left">120</span>s</div>
        <div>剩余步数: <span id="moves-left">80</span></div>
        <div>移动次数: <span id="move-count">0</span></div>
      </div>
      <div id="board" class="board"></div>
      <div id="achievement" class="achievement"></div>
      <div id="win-message" class="win-message"></div>
      <div id="shatter-overlay" class="shatter-overlay"></div>
    </section>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
